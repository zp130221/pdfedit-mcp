[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "niubai-pdfedit"
version = "0.1.0"
description = "Python client for the PDF Edit API gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "respx>=0.21",
    "datamodel-code-generator>=0.25",
]

[tool.setuptools]
packages = ["pdfedit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
