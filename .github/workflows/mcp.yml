# The agent-facing half of the PDF edit API: the npm MCP package and the two
# SDKs.
#
# Separate from `pdfedit.yml` (engine + gateway + image) because it shares
# nothing with it: no Python engine, no PyMuPDF, no corpus, and it finishes in
# a couple of minutes instead of forty.
#
# A `mcp-v*` tag publishes to npm.
name: mcp

on:
  push:
    branches:
      - main
    tags:
      - "mcp-v*"
      - "sdk-v*"
  pull_request:
    branches:
      - main
    paths:
      - "mcp/**"
      - "sdk/**"
      - "openapi/**"
      - ".github/workflows/mcp.yml"
  workflow_dispatch:

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  # =========================================================================
  # node -- the MCP package, the Cloudflare worker, the TypeScript SDK
  # =========================================================================
  node:
    name: node (mcp package, ts sdk)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            mcp/pdfedit-mcp/package-lock.json
            sdk/typescript/package-lock.json

      # ------------------------------------------------------------------
      # @niubai/pdfedit-mcp
      # ------------------------------------------------------------------
      - name: MCP package -- install
        working-directory: mcp/pdfedit-mcp
        run: npm ci

      - name: MCP package -- build
        working-directory: mcp/pdfedit-mcp
        run: npm run build

      # The suite includes the schema-freshness test: `src/schemas.gen.ts` is
      # generated from `openapi/openapi.json`, and a gateway schema change that
      # was not regenerated fails here rather than shipping tools whose
      # arguments the API no longer accepts.
      - name: MCP package -- tests
        working-directory: mcp/pdfedit-mcp
        run: npm test

      # Shape, and -- the part that actually catches things -- that the version
      # and identifier still agree with package.json and that `mcpName` matches
      # the registry name. A mismatch here is a failed registry publish later.
      - name: MCP package -- validate server.json
        working-directory: mcp/pdfedit-mcp
        run: npm run validate:server

      # ------------------------------------------------------------------
      # the TypeScript SDK
      # ------------------------------------------------------------------
      - name: TS SDK -- install
        working-directory: sdk/typescript
        run: npm ci

      - name: TS SDK -- build
        working-directory: sdk/typescript
        run: npm run build

      - name: TS SDK -- typecheck
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: TS SDK -- tests
        working-directory: sdk/typescript
        run: npm test

  # =========================================================================
  # python -- the Python SDK
  # =========================================================================
  python:
    name: python sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      # The dev extra carries pytest, respx and datamodel-code-generator: the
      # last one because the suite asserts that `pdfedit/models.py` is what
      # regenerating it from the OpenAPI document would produce.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./sdk/python[dev]"

      - name: Tests
        run: python -m pytest sdk/python/tests -q

  # =========================================================================
  # publish -- npm, on a mcp-v* tag only
  # =========================================================================
  # Everything is built and tested again here rather than carried over as an
  # artefact: what is published must come from the tag's own tree, and the
  # extra two minutes are cheaper than a published package nobody can
  # reproduce.
  publish:
    name: npm publish (mcp)
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    needs: [node, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Provenance: npm records which workflow, which commit and which tag
      # built the tarball, and the npm page shows it. Without this the
      # `--provenance` flag fails the publish.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: mcp/pdfedit-mcp/package-lock.json

      - name: Install
        working-directory: mcp/pdfedit-mcp
        run: npm ci

      - name: Build
        working-directory: mcp/pdfedit-mcp
        run: npm run build

      - name: Tests
        working-directory: mcp/pdfedit-mcp
        run: npm test

      - name: Validate server.json
        working-directory: mcp/pdfedit-mcp
        run: npm run validate:server

      # The tag is the release's name; package.json is what npm actually
      # publishes. If they disagree, the tag is wrong and the fix is to delete
      # it -- not to publish a version nobody asked for.
      - name: Tag matches package version
        working-directory: mcp/pdfedit-mcp
        run: |
          tag="${GITHUB_REF_NAME#mcp-v}"
          version=$(node -p "require('./package.json').version")
          echo "tag ${tag}, package.json ${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::tag mcp-v${tag} does not match package.json version ${version}"
            exit 1
          fi

      - name: Publish
        working-directory: mcp/pdfedit-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      # The registry submission itself is manual (`mcp-publisher login github`
      # is an interactive device flow) -- docs/launch/registry.md is the
      # runbook. This only says so in the place the release is watched from.
      - name: Next step
        run: |
          echo "::notice::published. Now: cd mcp/pdfedit-mcp && mcp-publisher login github && mcp-publisher publish (docs/launch/registry.md)"

  # =========================================================================
  # publish-sdk -- npm, on a sdk-v* tag only (the TypeScript SDK)
  # =========================================================================
  publish-sdk:
    name: npm publish (ts sdk)
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    needs: [node, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install
        working-directory: sdk/typescript
        run: npm ci

      - name: Build
        working-directory: sdk/typescript
        run: npm run build

      - name: Tests
        working-directory: sdk/typescript
        run: npm test

      - name: Tag matches package version
        working-directory: sdk/typescript
        run: |
          tag="${GITHUB_REF_NAME#sdk-v}"
          version=$(node -p "require('./package.json').version")
          echo "tag ${tag}, package.json ${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::tag sdk-v${tag} does not match package.json version ${version}"
            exit 1
          fi

      - name: Publish
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
